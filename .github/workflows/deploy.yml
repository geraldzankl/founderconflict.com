name: Publish FounderConflict
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      # One-time setup by a repository admin:
      # Settings > Pages > Build and deployment > Source > GitHub Actions.
      # GITHUB_TOKEN can deploy an existing Pages site, but cannot enable it.
      - name: Configure existing Pages site
        uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
